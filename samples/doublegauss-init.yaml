metadata:
  tool:
    name: RayWeaver
    url: https://github.com/onohiroki/RayWeaver
    schema_version: 1
  notes: |
    6-element symmetric double-Gauss starting point for a 35mm-format 50 mm
    f/2.8 standard lens (synthesised by an AI agent via curvature-scale search
    to hit EFL ~50 mm). Carries an optimization.escape section so the same file
    drives escape-demo.bash --lens doublegauss, doublegauss-demo.bash, and the
    --lens doublegauss mode of psf-mtf-demo.bash and wavefront-demo.bash. The
    escape uses a conditional merit schedule (merit_schedule) with the
    spot_diffraction metric: it compares the per-field weighted-average geometric
    spot RMS to the diffraction-limited Airy radius (0.61·λ/NA) and switches
    from a spot_rms-based geometric merit (spot_phase) to a wavefront RMS merit
    (wavefront_phase) via a step curve when the ratio drops below 1 (near the
    diffraction limit). Default anchors: anchor_from 3 / anchor_to 1. This
    two-phase approach first corrects geometric aberrations across all fields,
    then drives toward diffraction-limited performance. The escape parameters
    are tuned for the 36-variable landscape: distance_threshold 0.05, h_initial
    2.0 with max_cycles 10 — 76 distinct minima found (best Strehl 0.45/0.52/
    0.74/1.00 at 0°/10°/16°/23°). The six glass surfaces carry inline model
    glasses (no catalogue key), so each element's nd/vd is an independent
    variable — the glass can move (and flip crown/flint roles) during the
    escape. The glass variables span nd 1.4-2.0 / vd 20-80 to allow role
    reversal, and the escape merit adds six low-weight glass_role terms
    (surface_set per element) steering each element toward its chromatic-role
    target. The power_solve section adds a dedicated power-preserving glass
    phase to each escape cycle: every variable except the glass dispersions is
    locked, the merit is reversed to a colour-only axial/lateral objective, and
    the element thin-lens powers stay constant while only nd/vd move. The
    surfaces list the dependent back surface of each element (2, 4, 6, 9, 11,
    13); their curvatures are recomputed to hold power.
glass_catalog:
  entries:
  - type: model
    name: SK18
    nd: 1.63854
    vd: 55.42
  - type: model
    name: SF12
    nd: 1.64831
    vd: 33.84
optimization:
  method: dls
  max_iter: 500
  tol: 1.0e-07
  epsilon: 1.0e-06
  num_rays: 256
  aperture_margin: 1.2
  power_solve:
    enabled: true
    surfaces: [2, 4, 6, 9, 11, 13]
  escape:
    max_cycles: 10
    escape_workers: 8
    distance_threshold: 0.05
    h_initial: 2.0
    w_initial: 0.8
    h_mult: 2.0
    w_mult: 1.3
    escape_iter_frac: 0.25
    w_span: 3.0
    initial_perturb: 0.10
  merit_schedule:
    metric: spot_diffraction
    metric_aggregation: mean
    curve: step
    anchor_from: 3.0
    anchor_to: 1.0
    modes:
    - name: spot_phase
      weight_from: 1.0
      weight_to: 0.0
    - name: wavefront_phase
      weight_from: 0.0
      weight_to: 1.0
