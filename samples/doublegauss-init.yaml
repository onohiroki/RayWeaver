metadata:
  tool:
    name: RayWeaver
    url: https://github.com/onohiroki/RayWeaver
    schema_version: 1
  notes: |
    6-element symmetric double-Gauss starting point for a 35mm-format 50 mm
    f/2.8 standard lens (synthesised by an AI agent via curvature-scale search
    to hit EFL ~50 mm). Carries an optimization.escape section so the same file
    drives escape-demo.bash --lens doublegauss, doublegauss-demo.bash, and the
    --lens doublegauss mode of psf-mtf-demo.bash and wavefront-demo.bash. The
    escape merit is the spot merit (spot_rms per field) plus moderate-weight
    off-axis spot kinds (spot_rms_t/_s/_worst on 10°/16°, spot_rms_worst/
    spot_rms_weighted/spot_ee_radius on 23°), lateral_color and opd_rms: the
    full-weight off-axis set collapses the landscape to a single basin, but the
    reduced weights here steer the edge-field performance (23° chief spot RMS
    0.216 -> 0.113) while keeping many local minima. The escape parameters are
    tuned for the 36-variable landscape: distance_threshold 0.05 (the 0.15
    default merges the close-spaced high-dimensional minima into one) and
    h_initial 2.0 with max_cycles 10 (stronger bumps, more attempts) — 20
    distinct minima found in a bounded test run (best merit 0.0188).
    The six glass surfaces carry inline model glasses (no catalogue key), so
    each element's nd/vd is an independent variable — the glass can move (and
    flip crown/flint roles) during the escape, unlike keyed references which
    collapse to a shared per-key override. The glass variables span
    nd 1.4-2.0 / vd 20-80 to allow role reversal, and the escape merit adds six
    low-weight glass_role terms (surface_set per element) steering each element
    toward its chromatic-role target while the spot/colour/opd terms keep the
    imagery healthy.
    The power_solve section adds a dedicated power-preserving glass phase to
    each escape cycle (between the escape and clean DLS): every variable except
    the glass dispersions is locked, the merit is reversed to a colour-only
    axial/lateral objective, and the element thin-lens powers stay constant
    while only nd/vd move — so the glass balance corrects the chromatic error
    without drifting the layout. The surfaces list the dependent back surface
    of each element (2, 4, 6, 9, 11, 13); their curvatures are recomputed to
    hold power.
glass_catalog:
  entries:
  - type: model
    name: SK18
    nd: 1.63854
    vd: 55.42
  - type: model
    name: SF12
    nd: 1.64831
