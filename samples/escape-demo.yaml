metadata:
  tool:
    name: RayWeaver
    url: https://github.com/onohiroki/RayWeaver
    schema_version: 1
  notes: |
    Input for samples/escape-demo.bash (default lens).
    Escape-function global optimisation of a degraded US2645157 triplet:
    3 fields (0/16/24 deg), d/F/C wavelengths, 4 curvature variables
    (s1/s3/s6/s7), DLS max_iter 200 with 4 escape cycles / 3 workers.
    The merit is the off-axis spot set (spot_rms + spot_rms_worst per field)
    with NO wavefront term: the full spot_rms_t/_s/_weighted/spot_ee_radius
    set collapses the landscape to a single basin, so the escape merit keeps
    only the spot_rms backbone plus one spot_rms_worst term per field to
    preserve multiple local minima (5 found). The escape then robustly finds
    the well-corrected basin (0/16/24 deg Strehl ~0.99/~0.11/~0.63 — the 24°
    outer field is already >= 0.5). escape-demo.bash refines that best with a
    wavefront_astigmatism merit (w16=14000, w24=6500, 24° spot terms w=0.11,
    512-ray grid) so every field reaches Strehl >= 0.5 (~0.97/~0.51/~0.63),
    and then verifies the profile with `rayweave psf --best-focus`.
    Feed to `rayweave escape` to get escape_result.minima[]; the bash script
    wraps it with --verbose + JSONL progress.
glass_catalog:
  entries:
    - name: "SK18"
      nd: 1.63854
      vd: 55.42
    - name: "SF12"
      nd: 1.64831
      vd: 33.84

chief:
  fields:
    - angle: 0.0
      direction: [0, 1]
    - angle: 16.0
      direction: [0, 1]
    - angle: 24.0
      direction: [0, 1]
  reference_surface: 8
  reference_wavelength: 0.0005876
  num_rays: 512
  grid_type: hex
  dump_map: true

optimization:
  method: dls
  max_iter: 200
  escape:
    max_cycles: 4
    escape_workers: 3
    distance_threshold: 0.15
    h_initial: 0.5
    w_initial: 0.4
    h_mult: 2.0
    w_mult: 1.3
  variables:
    - name: s1_curvature
      target:
        type: surface
        id: 1
        param: curvature
      min: 0.02
      max: 0.3
      active: true
    - name: s3_curvature
      target:
        type: surface
        id: 3
        param: curvature
      min: -0.3
      max: -0.01
      active: true
    - name: s6_curvature
      target:
        type: surface
        id: 6
        param: curvature
      min: 0.005
      max: 0.5
      active: true
    - name: s7_curvature
      target:
        type: surface
        id: 7
        param: curvature
      min: -0.3
      max: -0.01
      active: true

