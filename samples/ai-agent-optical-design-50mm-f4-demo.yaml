metadata:
    notes: 'AI-agent demonstration input: six-element air-spaced lens in a double-Gauss-like layout, adapted from 6elements-init.yaml for 35 mm full-frame, 50 mm F/4. The parent 6elements-init.yaml lens-data prescription was generated by an AI agent without an existing prescription as a seed, using curvature-scale search to reach EFL about 50 mm. Other settings in the parent sample, including optimization merit, constraints, and multi-field/wavelength evaluation, were added later through human-user and AI-agent interactions. All elements are singlets; there are no cemented doublets. The initial layout is approximately symmetric, but independent optimization variables do not constrain symmetry. EFL target 50 mm; entrance pupil 12.5 mm; fields 0, 10, 16, and 23.4 degrees; F/d/C wavelengths. Aperture variables are fixed and field_alive/pupil_fill terms guard pupil coverage. This F/4 adaptation starts from the earlier AI-generated lens data.'
    tool:
        name: RayWeaver
        schema_version: 1
        url: https://github.com/onohiroki/RayWeaver
optimization:
    aperture_margin: 1.2
    epsilon: 1e-06
    max_iter: 500
    merit_schedule:
        anchor_from: 1
        anchor_to: 0.1
        curve: step
        metric: merit_ratio
        modes:
            - name: spot_phase
              weight_from: 1
              weight_to: 0
            - name: wavefront_phase
              weight_from: 0
              weight_to: 1
    method: dls
    num_rays: 256
    power_solve:
        enabled: true
        surfaces:
