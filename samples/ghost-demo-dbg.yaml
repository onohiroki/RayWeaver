# doublegauss-ghost.yaml
#
# Ghost-ray trace sample on the optimised double-Gauss system
# (samples/doublegauss-result.yaml, 6 elements / 14 surfaces, 50 mm f/2.8).
#
# Surface-sequence encoding of ghost paths (after Ono, Matsumura & Ushiyama,
# "Exploring ghost ray tracing in a massively parallel fast ray tracing within
# a cloud computing environment", Optical Review 32:402-411, 2025):
#   - each ray carries an ordered list of surface IDs as an attribute
#   - a continuous ascent/descent of the list means REFRACTION at that surface
#   - a direction reversal in the list means REFLECTION at that surface
#
# Ghost path configured below: [0,1,2,3,4,3,2,3,4,...,14]
#   - forward to surface 4, reflect there (pattern 3,4,3)
#   - travel back through surface 3 (reversed refraction), reflect at surface 2
#     (pattern 3,2,3), then forward again to the image (surface 14).
# The ray also traces the corresponding normal path for comparison.
#
# The `chief` section is used by samples/ghost-demo.bash to re-adjust the lens
# effective diameters (`chief --clear-aperture --shrink`) before plotting.
# Run:  rayweave trace < samples/doublegauss-ghost.yaml
