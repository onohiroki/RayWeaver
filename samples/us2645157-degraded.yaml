metadata:
  tool: RayWeaver
  url: https://github.com/onohiroki/RayWeaver
  schema_version: 1
  notes: |
    Degraded US2645157 triplet (curvatures distorted so every field is badly
    out of focus) carrying the OFF-AXIS spot merit kinds: spot_rms_t/_s/_worst
    on the 16 deg field, spot_rms_worst/_weighted/_ee_radius on the 24 deg
    field. Input of optimize-demo.bash (the "new" off-axis merit run).

glass_catalog:
  entries:
  - name: "SK18"
    nd: 1.63854
    vd: 55.42
  - name: "SF12"
    nd: 1.64831
    vd: 33.84

chief:
  stop_surface: 4
  pass_through:
    surface: 4
  fields:
  - angle: 0.0
    direction: [ 0, 1 ]
  - angle: 16.0
    direction: [ 0, 1 ]
  - angle: 24.0
    direction: [ 0, 1 ]
  reference_surface: 8
  reference_wavelength: 0.0005876
  num_rays: 512
  grid_type: hex
  dump_map: true

optimization:
  method: dls
  variables:
  - name: s1_curvature
    target:
      type: surface
      id: 1
      param: curvature
    min: 0.02
    max: 0.3
    active: true
  - name: s3_curvature
    target:
      type: surface
      id: 3
      param: curvature
    min: -0.3
    max: -0.01
    active: true
  - name: s6_curvature
    target:
      type: surface
      id: 6
      param: curvature
    min: 0.005
    max: 0.5
    active: true
  - name: s7_curvature
    target:
      type: surface
      id: 7
      param: curvature
    min: -0.3
    max: -0.01
    active: true

