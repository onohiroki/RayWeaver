metadata:
  tool: RayWeaver
  url: https://github.com/onohiroki/RayWeaver
  schema_version: 1
  notes: |
    3-config zoom lens (config0/1/2 = wide/mid/tele) with shared-variable DLS
    optimisation, fuzzy image-height / incident-angle constraints, and
    ray_paths (render-only metadata). Input of simple-zoom-demo.bash.

glass_catalog:
  entries:
    - type: model
      label: BK7
      nd: 1.5168
      vd: 64.1673
    - type: model
      label: F2
      nd: 1.62004
      vd: 36.37

optimization:
  method: dls
  max_iter: 500
  mu: 0.1
  tol: 1e-4
  epsilon: 1e-4
  num_rays: 256
  mu_con_max: 10.0
  aperture_margin: 1.0

  shared_variables:
    - name: s1_curvature
      min: -0.2
      max: 0.2
      active: true
      bindings:
        - config: config0
          id: 1
          param: curvature
        - config: config1
          id: 1
          param: curvature
        - config: config2
          id: 1
          param: curvature

    - name: s2_curvature
      min: -0.2
      max: 0.2
      active: true
      bindings:
        - config: config0
          id: 2
          param: curvature
        - config: config1
          id: 2
          param: curvature
        - config: config2
          id: 2
          param: curvature

    - name: s3_curvature
      min: -0.2
      max: 0.2
      active: true
      bindings:
        - config: config0
          id: 3
          param: curvature
        - config: config1
          id: 3
          param: curvature
        - config: config2
          id: 3
          param: curvature

    - name: s4_curvature
      min: -0.2
      max: 0.2
      active: true
      bindings:
        - config: config0
          id: 4
          param: curvature
