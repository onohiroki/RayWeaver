          id: 5
          param: curvature
        - config: config1
          id: 5
          param: curvature
        - config: config2
          id: 5
          param: curvature

    - name: s6_curvature
      min: -0.2
      max: 0.2
      active: true
      bindings:
        - config: config0
          id: 6
          param: curvature
        - config: config1
          id: 6
          param: curvature
        - config: config2
          id: 6
          param: curvature

    - name: s7_curvature
      min: -0.2
      max: 0.2
      active: true
      bindings:
        - config: config0
          id: 7
          param: curvature
        - config: config1
          id: 7
          param: curvature
        - config: config2
          id: 7
          param: curvature

    - name: s1_thickness
      min: 1.0
      max: 20.0
      active: true
      bindings:
        - config: config0
          id: 1
          param: thickness
        - config: config1
          id: 1
          param: thickness
        - config: config2
          id: 1
          param: thickness

    - name: s3_thickness
      min: 1.0
      max: 20.0
      active: true
      bindings:
        - config: config0
          id: 3
          param: thickness
        - config: config1
          id: 3
          param: thickness
        - config: config2
          id: 3
          param: thickness

    - name: s5_thickness
      min: 1.0
      max: 20.0
      active: true
      bindings:
        - config: config0
          id: 5
          param: thickness
        - config: config1
          id: 5
          param: thickness
        - config: config2
          id: 5
          param: thickness

    - name: s7_thickness
      min: 0.5
      max: 5.0
      active: true
      bindings:
        - config: config0
          id: 7
          param: thickness
        - config: config1
          id: 7
          param: thickness
        - config: config2
          id: 7
          param: thickness

  local_variables:
    - name: config0_s2_thickness
      config: config0
      target:
        type: surface
        id: 2
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config0_s4_thickness
      config: config0
      target:
        type: surface
        id: 4
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config0_s6_thickness
      config: config0
      target:
        type: surface
        id: 6
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config1_s2_thickness
      config: config1
      target:
        type: surface
        id: 2
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config1_s4_thickness
      config: config1
      target:
        type: surface
        id: 4
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config1_s6_thickness
      config: config1
      target:
        type: surface
        id: 6
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config2_s2_thickness
      config: config2
      target:
        type: surface
        id: 2
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config2_s4_thickness
      config: config2
      target:
        type: surface
        id: 4
        param: thickness
      min: 0.1
      max: 200.0
      active: true

    - name: config2_s6_thickness
      config: config2
      target:
        type: surface
        id: 6
        param: thickness
      min: 0.1
      max: 200.0
      active: true

  constraints: []

