# 9-layer quarter-wave dielectric mirror (Bragg reflector)
# Alternating SiO2 (n=1.46) and TiO2 (n=2.35) on glass substrate
# Design wavelength: 550nm
metadata:
  tool: RayWeaver
  url: https://github.com/onohiroki/RayWeaver
  schema_version: 1
  notes: |
