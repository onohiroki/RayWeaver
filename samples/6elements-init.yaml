metadata:
  tool:
    name: RayWeaver
    url: https://github.com/onohiroki/RayWeaver
    version: dev
    schema_version: 1
    generator: optimize
  created_at: '2026-09-06T09:49:01Z'
  notes: '6-element F/4 wide-field escape demo starting point (6elements-init.yaml).

    Provenance: test-014-result.yaml (escape-optimised + wavefront-refined

    6-element double-Gauss, EFL 49.53, EPD 12.198 = F/4.06, PSF Strehl

    0.987/0.841/0.623/0.439/0.404 at d-line) flattened: ONLY surface 1 keeps

    its convex radius; surfaces 2-12 are plane (curvature 0), so the start is a

    single refracting surface + parallel glass plates, all glasses BK7

    (nd=1.5168, vd=64.17). Start apertures are widened so every field traces

    (fixed stop s7 dia 20 -> the EPD handle via the s7_dia variable [11,15];

    auto surfaces 30; image plane 120 - the flat start''s 23deg chief lands at

    y~40 mm, outside the original 44 mm image surface). Paraxial EFL at start

    ~79.7 mm (out of the 49.5-50.5 band).

    Element thin-lens powers are ''power'' variables (targets 2,4,6,8,10,12,

    [-0.04, 0.04], start 0): the dependent back-surface curvature is recomputed

    every evaluation (paraxial.SolveElementPower), so the design can build

    element power from the flattened zero-power start. During the escape glass

    phase the non-glass lock freezes the power variables - the power-preserving

    solve becomes active exactly then, without optimization.power_solve (whose

    initial-state snapshot would pin the zero powers forever). The front

    curvatures (1,3,5,7,9,11) stay curvature variables.

    Merit = conditional schedule (merit_ratio, step, 1->0.1): spot_phase

    (3-wavelength spot_rms 5 fields + T/S/worst + lateral_color + glass_role)

    switching to wavefront_phase (opd_rms 5 fields + astigmatism + spots +

    lateral_color + glass_role). NOTE: merit_modes without merit_schedule

    evaluates the (absent) fixed merit - objective stays 0 and the run chases

    constraints only; the schedule is required.

    Escape: 10 cycles, 8 workers, distance threshold 0.05 (test-init002

    lineage), central_diff/bfgs off (forward-difference Jacobian; the degraded

    start wastes central-difference cost on the early rejected-step phase),

    num_rays 128 (hex 129 points - escape speed; raise for the wavefront

    polish stage), max_iter 50.

    Demo target: Strehl >=0.6 centre / >=0.4 off-axis (d-line), EFL 49.5-50.5,

    EPD 12.2-12.8.'
