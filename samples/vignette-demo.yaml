# Vignette demo input: the OPTIMIZED double-Gauss with overspecified
# (inflated) effective diameters.
#
# The base lens is samples/doublegauss-result.yaml — the fully DLS-optimized
# 6-element 50 mm f/2.8 double-Gauss (on-axis spot RMS ~0.06 mm, so the rays
# come to a tight focus). Every auto_aperture: true surface is deliberately
# inflated to a uniform 36 mm diameter so the "before" state reads as wasteful
# glass: the beam only fills the center of each element. `rayweave vignette`
# then shrinks each auto_aperture surface to its surviving-beam envelope
# (2x extent + margin), settles per-field vignetting, and applies the
# min_glass_path (edge-thickness >= 0.5 mm) constraint, so the "after" state
# has just-right effective apertures with manufacturable edge thickness.
#
# Surface 7 (fixed aperture D=17.5, the f/2.8 stop) and surface 14 (image
# plane) are fixed (auto_aperture: false) and never re-sized.
#
# No chief.stop_surface is set: the entrance/exit pupils are derived from the
# chief-ray crossings (dynamic pupil).
#
# The `rays` section carries hand-written marginal rays so the initial diagram
# draws every field's bundle at the SAME thickness (12.5 mm): each bundle is a
# parallel set launched from z=-100 at the field chief ray's height +- 6.25 mm
# along the field direction. This is a schematic choice — the physically
# vignetted off-axis bundles would be narrower, and drawing them at the
# on-axis's full aperture makes the outer rays refract wildly off the rear
# elements (they no longer reach focus). 12.5 mm is the widest uniform bundle
# that focuses cleanly for all four fields. The `chief_rays` section records
# the per-field chief rays so `trace | plot` draws them (and colors the
# bundles) directly from this file; `chief`/`vignette` recompute and overwrite
# it, so it only affects the direct trace plot.

metadata:
  tool:
    name: RayWeaver
    url: https://github.com/onohiroki/RayWeaver
    schema_version: 1
  notes: |
    Vignette demo input: the OPTIMIZED 6-element 50 mm f/2.8 double-Gauss
    (from doublegauss-result.yaml) with every auto_aperture surface
    deliberately inflated to 36 mm so the "before" state reads as wasteful
    glass. `rayweave vignette` shrinks each auto_aperture surface to its
    surviving-beam envelope (2x extent + margin), settles per-field vignetting,
    and applies the min_glass_path (>= 0.5 mm) edge-thickness constraint.
    Surface 7 (fixed stop D=17.5) and the image plane are fixed. No
    chief.stop_surface: pupils come from the chief-ray crossings (dynamic
    pupil). The `rays` section carries hand-written marginal rays (12.5 mm
    bundles) so the initial diagram draws every field at the same width. Input
    of vignette-demo.bash.
