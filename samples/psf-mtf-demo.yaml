# PSF / OTF / MTF demo input — US2645157 triplet refined with the 16° 
# wavefront_astigmatism merit (see escape-demo.yaml; the DLS re-optimisation of
# the escape best with the 16° astigmatism term at w16=14000 and the 24°
# spot terms at w24=0.05 yields 0°/16°/24° Strehl ~0.99/~0.62/~0.59 — the 0°>
# 16°>24° profile used by the demo table, meeting 0.9/0.6/0.5).
# Cleaned copy: only the sections the `psf` subcommand consumes (glass_catalog,
# configs, chief); the optimization/escape_result history lives in the original
# escape-demo-result.yaml (untracked). Three fields (0/16/24 deg), reference
# surface 8. MTF is reported up to psf.mtf_config.max_frequency (200 c/mm) —
# the demo script's --max-freq CLI flag overrides this, so the cap stays
# effective even when the run uses a different lens YAML.
