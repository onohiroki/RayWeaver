metadata:
  tool: RayWeaver
  url: https://github.com/onohiroki/RayWeaver
  schema_version: 1
  notes: |
    3-lens 7-surface system (the real US2645157 Cooke triplet with the
    flint/crown glasses SWAPPED) with glass-model variables (nd/vd) for DLS
    optimisation. 3 fields (0/16/24 deg), 4 wavelengths (g/F/d/C). Demonstrates
    the conditional merit_schedule (color_first -> full blend). Input of
    glass-optimize-demo.bash.

glass_catalog:
  entries:
  - name: "SK18"
    nd: 1.63854
    vd: 55.42
  - name: "SF12"
    nd: 1.64831
    vd: 33.84

# The real US2645157 Cooke triplet, but the negative-power element (S3) carries
# a crown (SK18 values) and the positive-power element (S6) a flint (SF12
# values) — the flint/crown arrangement is swapped. S3/S6 are inline model
# glasses (no catalogue key) so the glass variables touch only their own
# surfaces.
chief:
  stop_surface: 4
  pass_through:
    surface: 4
  fields:
  - angle: 0.0
    direction: [ 0, 1 ]
  - angle: 16.0
    direction: [ 0, 1 ]
  - angle: 24.0
    direction: [ 0, 1 ]
  reference_surface: 8
  num_rays: 512
  grid_type: hex
  dump_map: true
  wavelengths: [ 0.0004358, 0.0004861, 0.0005876, 0.0006563 ]

optimization:
  method: dls
  max_iter: 300
  mu: 0.01
  tol: 1e-4
  epsilon: 1e-4
  num_rays: 256
  mu_con_max: 50.0
  aperture_margin: 1.0
  # Smooth merit blend: while the colour-only merit is still large the glass is
  # driven by the colour terms alone (imagery not yet converged); as the colour
  # errors collapse the full merit (spot RMS included) fades in.
  merit_schedule:
    metric: merit_ratio
    curve: linear
    anchor_from: 1.0
    anchor_to: 0.05
    modes:
    - name: color_first
      weight_from: 1.0
      weight_to: 0.0
    - name: full
      weight_from: 0.0
      weight_to: 1.0
  variables:
  - name: s3_nd
    target:
      type: surface
      id: 3
      param: nd
    min: 1.4
    max: 1.9
    active: true
  - name: s3_vd
    target:
      type: surface
      id: 3
      param: vd
    min: 20.0
    max: 80.0
    active: true
  - name: s6_nd
    target:
      type: surface
      id: 6
      param: nd
    min: 1.4
    max: 1.9
    active: true
  - name: s6_vd
    target:
      type: surface
      id: 6
      param: vd
    min: 20.0
    max: 80.0
    active: true

