    curve: sigmoid
    anchor_from: 1.0
    anchor_to: 0.2
    modes:
    - name: geometric
      weight_from: 1.0
      weight_to: 0.0
      back_focus_type: paraxial
    - name: wavefront
      weight_from: 0.0
      weight_to: 1.0
      back_focus_type: paraxial
