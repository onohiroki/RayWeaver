metadata:
  tool:
    name: RayWeaver
    url: https://github.com/onohiroki/RayWeaver
    version: dev
    schema_version: 1
  created_at: "2026-10-01T19:30:00Z"
  notes: |-
    Escape optimization v52 demo: 6-element double-Gauss, virtual entrance pupil.
    v52 = v51 with three input changes (same start point, constraints, gates, glass_hull, power_solve, merit_schedule, num_rays 256, central_diff+bfgs, initial_perturb 0.10):
    (1) MERIT: wavefront family replaced by spot-based low-order terms in both merit_modes. wavefront_defocus x5 -> spot_flatness x5 (same weights 400/400/480/600/720, target 0); spot_astigmatism x5 added (same weights, target 0); wavefront_rms_residual and wavefront_shift_sag/_tan x10 removed. Remaining: spot_rms_t/_s/worst/ee_radius + lateral/longitudinal colour + glass_role + field_alive + spot_flatness/spot_astigmatism.
    (2) BACK FOCUS: back_focus_solve.type wavefront -> spot, num_rays 400 -> 256; both merit_modes back_focus_type -> spot.
    (3) vp_z variable range -20..50 -> 0..30 mm.
    Demo variant: max_cycles 4 (the v52 prod run found its best gate-passing minimum at cycle 3). Merit numbers are not comparable with v51 (different term set).
