    schema_version: 1
  notes: "Escape optimization v14: 6-element double-Gauss, virtual entrance pupil.\n\
    v13 base with infeasible-threshold relaxation:\n- min_glass_path relaxed:\
    \ 2.0->0.5 (thin-element oblique rays)\n- min_throughput_ratio: 0.3->0.1\
    \ (validateFn threshold)\n- all other settings inherited from v13\n8h time\
    \ budget.\n"
